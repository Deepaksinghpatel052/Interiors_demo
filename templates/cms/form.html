{% extends "studio/base.html" %}
{% block page_title %}{{ title }}{% endblock %}
{% block heading %}<a href="{% url 'cms:list' kind %}" class="text-muted text-decoration-none" aria-label="Back"><i class="bi bi-arrow-left"></i></a> {{ title|truncatechars:60 }}{% endblock %}
{% block erp_content %}
<div class="panel" style="max-width:56rem"><div class="panel-body">
  <form method="post" enctype="multipart/form-data" class="form-compact row g-2" novalidate data-loading>{% csrf_token %}
    {% include "cms/_fields.html" %}
    <div class="col-12 d-flex gap-2 justify-content-end mt-2">
      <a class="btn btn-light" href="{% url 'cms:list' kind %}">Cancel</a>
      <button class="btn btn-accent" data-loading-text="Saving…">Save &amp; publish</button>
    </div>
  </form>
  {% if obj %}
  <form method="post" action="{% url 'cms:delete' kind obj.pk %}" class="mt-3 pt-3 border-top" data-confirm="Delete this {{ singular }}? It will be removed from the website.">
    {% csrf_token %}<button class="btn btn-sm btn-light text-danger"><i class="bi bi-trash3 me-1"></i> Delete {{ singular }}</button></form>
  {% endif %}
</div></div>
{% endblock %}
