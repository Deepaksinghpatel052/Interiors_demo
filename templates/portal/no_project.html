{% extends "base.html" %}
{% block title %}My project — {{ studio.name }}{% endblock %}
{% block content %}
<section class="section"><div class="container text-center" style="max-width:36rem">
  <div class="icon-circle mx-auto" style="width:72px;height:72px;font-size:2rem"><i class="bi bi-house-heart"></i></div>
  <h1 class="h3 mt-3">Your project space is being set up</h1>
  <p class="lead-text mx-auto">Once your project starts, you'll see designs, timelines, documents and payments here.</p>
  <a class="btn btn-wa" target="_blank" rel="noopener" href="{% wa_link studio.whatsapp 'Hi, I would like to know about my project.' %}"><i class="bi bi-whatsapp me-1"></i> Message the studio</a>
</div></section>
{% endblock %}
