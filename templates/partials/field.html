<div class="{{ col|default:'col-12' }}">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-accent">*</span>{% endif %}</label>
  {{ field }}
  {% for e in field.errors %}<div class="invalid-feedback">{{ e }}</div>{% endfor %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
</div>
