# Studio OS in Docker.
#   Start / update:  docker compose up -d --build
#   Logs:            docker compose logs -f web
# Every value (port, data folder, database, cache, timezone, ...) comes from .env — see .env.example.
# The app listens on 127.0.0.1:${APP_PORT}; open http://localhost:${APP_PORT}/
name: interiors

x-app: &app
  image: interiors-studio:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: ${DOCKER_DATABASE_URL:?set DOCKER_DATABASE_URL in .env}
    CACHE_DIR: ${DOCKER_CACHE_DIR:?set DOCKER_CACHE_DIR in .env}

services:
  web:
    <<: *app
    build: .
    command: web
    ports:
      - "127.0.0.1:${APP_PORT:?set APP_PORT in .env}:${APP_PORT}"
    volumes:
      - ${DOCKER_DATA_DIR:?set DOCKER_DATA_DIR in .env}/data:/app/data
      - ${DOCKER_DATA_DIR}/media:/app/media
      - ${DOCKER_DATA_DIR}/staticfiles:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request as u; u.urlopen('http://127.0.0.1:%s/privacy/' % os.environ['APP_PORT'], timeout=5)\" > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 600s   # first start loads the data snapshot
      retries: 3

  scheduler:
    <<: *app
    command: scheduler
    volumes:
      - ${DOCKER_DATA_DIR}/data:/app/data
      - ${DOCKER_DATA_DIR}/media:/app/media
    depends_on:
      web:
        condition: service_started
